buildscript {
    repositories {
        maven { url = 'https://mirror.sjtu.edu.cn/bmclapi' }
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        maven { url = 'https://maven.cleanroommc.com' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.0.194'
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'

group   = project.mod_group
version = project.mod_version
archivesBaseName = project.mod_name

sourceCompatibility = targetCompatibility = '1.8'
compileJava {
    sourceCompatibility = targetCompatibility = '1.8'
    options.encoding = 'UTF-8'
}

minecraft {
    mappings channel: 'stable', version: '39-1.12'
    runs {
        client {
            workingDirectory project.file('run')
        }
        server {
            workingDirectory project.file('run')
        }
    }
}

repositories {
    maven {
        name = 'Mojang'
        url = 'https://libraries.minecraft.net/'
    }
    maven { url = 'https://mirror.sjtu.edu.cn/bmclapi' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    maven { url = 'https://maven.cleanroommc.com' }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2860:userdev3'

    compileOnly 'org.spongepowered:mixin:0.8.5'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

mixin {
    add sourceSets.main, "placewatchdebug.refmap.json"
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', project.mc_version
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': project.mc_version
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

jar {
    manifest {
        attributes([
            'FMLCorePluginContainsFMLMod': 'true',
            'ForceLoadAsMod'             : 'true',
            'MixinConfigs'               : 'placewatchdebug.mixins.json',
            'TweakClass'                 : 'org.spongepowered.asm.launch.MixinTweaker',
            'TweakOrder'                 : '0'
        ])
    }
}